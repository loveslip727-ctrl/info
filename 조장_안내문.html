<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조장님 안내</title>
<style>
  :root {
    --bg: #f3f6f4;
    --paper: #ffffff;
    --ink: #1c2a25;
    --sub: #5a6b64;
    --line: #d5ded9;
    --accent: #1f6b52;
    --accent-soft: #e4f1ec;
    --warn: #8a4b12;
    --warn-soft: #fbf0e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a17;
      --paper: #1b2622;
      --ink: #e8f0ec;
      --sub: #9fb0a8;
      --line: #2f3d37;
      --accent: #6fcfac;
      --accent-soft: #1f3a31;
      --warn: #f0b97a;
      --warn-soft: #3a2c1a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.7;
    padding: 32px 16px;
  }
  .sheet {
    max-width: 640px;
    margin: 0 auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  header {
    padding: 28px 28px 22px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--sub); font-size: 0.95rem; }
  section { padding: 22px 28px; border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: 0; }
  h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .item { display: flex; gap: 14px; }
  .mark {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--paper);
    display: grid; place-items: center;
    font-weight: 700; font-size: 0.95rem;
    margin-top: 2px;
  }
  .item p { margin: 0; }
  .callout {
    margin-top: 12px;
    padding: 12px 14px;
    background: var(--warn-soft);
    color: var(--warn);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .phone {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 14px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
  }
  .contact { background: var(--accent-soft); }
  .contact dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  .contact dt { color: var(--sub); }
  .contact dd { margin: 0; font-weight: 600; }
  .contact a { color: var(--accent); text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media print { body { background: #fff; padding: 0; } .sheet { border: 0; } }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <h1>조장님 안내사항</h1>
    <p>아래 두 가지 내용을 확인해 주세요.</p>
  </header>

  <section>
    <div class="item">
      <div class="mark">1</div>
      <div>
        <h2>11월 워크북교육 이수확인증 준비</h2>
        <p>조장님들은 내일(11/10(화)) 11월 워크북교육 이수확인증을 준비해 주시기 바랍니다.</p>
      </div>
    </div>
  </section>

  <section>
    <div class="item">
      <div class="mark">2</div>
      <div>
        <h2>비서 전화 안내</h2>
        <p>제가 채용한 홍아린 비서에게서 정보 전달을 위해 전화가 걸려올 수 있습니다. 놀라시거나 착오 없으시길 바랍니다.</p>
        <a class="phone" href="tel:0269490911">홍아린 비서 02-6949-0911</a>
        <div class="callout">모르는 번호라고 당황하지 마시고, 위 번호로 오는 전화는 안내 목적의 연락입니다.</div>
      </div>
    </div>
  </section>

  <section class="contact">
    <h2>담당자</h2>
    <dl>
      <dt>성명</dt><dd>임태진</dd>
      <dt>연락처</dt><dd><a href="tel:07044462909">070-4446-2909</a></dd>
    </dl>
  </section>
</main>
</body>
</html>
