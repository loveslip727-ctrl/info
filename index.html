
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:#0e1117;color:#fafafa}
  .app{max-width:680px;margin:0 auto;padding:2rem 1.5rem}
  .st-title{font-size:22px;font-weight:700;color:#fafafa;margin-bottom:.3rem}
  .st-divider{border:none;border-top:1px solid #333;margin:.8rem 0 1.5rem}
  .st-label{font-size:13px;color:#a0a0a0;margin-bottom:.7rem;font-weight:500}
  .box-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
  .type-box{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:1rem .6rem;cursor:pointer;transition:all .15s;text-align:center}
  .type-box:hover{border-color:#4da6ff;background:#1e2a3e}
  .type-box.active{border-color:#4da6ff;background:#1a3a5c}
  .type-box.all-box{border-color:#6c3483;background:#1a1030}
  .type-box.all-box:hover{border-color:#a855f7;background:#220f40}
  .type-box.all-box.active{border-color:#a855f7;background:#2d1054}
  .type-box .icon{font-size:20px;margin-bottom:.4rem}
  .type-box .label{font-size:13px;font-weight:700;color:#fafafa}
  .type-box .sub{font-size:10px;color:#666;margin-top:.3rem}
  .type-box.all-box .label{color:#c084fc}
  .type-box.all-box .sub{color:#9d5cf6}
  .ment-box{background:#1a1f2e;border:1px solid #2d3748;border-radius:8px;padding:1rem 1.2rem;margin-bottom:.5rem;min-height:100px}
  .ment-label{font-size:11px;color:#555;margin-bottom:.5rem}
  .ment-text{font-size:14px;color:#e0e0e0;line-height:2;white-space:pre-line}
  .ment-placeholder{font-size:13px;color:#444;font-style:italic}
  .now-playing{font-size:11px;color:#a855f7;margin-bottom:.4rem;font-weight:500}
  .sound-bar{display:flex;align-items:flex-end;gap:3px;height:20px;margin-top:.6rem}
  .bar{width:4px;background:#4da6ff;border-radius:2px;animation:wave 1s infinite ease-in-out}
  .bar:nth-child(1){animation-delay:0s;height:6px}
  .bar:nth-child(2){animation-delay:.1s;height:14px}
  .bar:nth-child(3){animation-delay:.2s;height:20px}
  .bar:nth-child(4){animation-delay:.3s;height:10px}
  .bar:nth-child(5){animation-delay:.4s;height:18px}
  .bar:nth-child(6){animation-delay:.5s;height:5px}
  @keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  .hidden{display:none}
  .divider2{border:none;border-top:1px solid #222;margin:.8rem 0 1.2rem}
  .st-textarea{width:100%;background:#1a1f2e;border:1px solid #2d3748;border-radius:6px;color:#fafafa;font-family:'Noto Sans KR',sans-serif;font-size:13.5px;padding:.75rem 1rem;resize:vertical;min-height:80px;outline:none;transition:border .15s}
  .st-textarea:focus{border-color:#4da6ff}
  .st-textarea::placeholder{color:#444}
  .btn-row2{display:flex;gap:8px;margin-top:.6rem}
  .st-btn{flex:1;background:#4da6ff;border:none;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;padding:.65rem;border-radius:6px;cursor:pointer}
  .st-btn:hover{background:#3a90e0}
  .st-btn:disabled{background:#1e3a5c;color:#555;cursor:not-allowed}
  .stop-btn{margin-top:.4rem;width:100%;background:#7c3aed;border:none;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;padding:.5rem;border-radius:6px;cursor:pointer}
  .stop-btn:hover{background:#6d28d9}

  /* 저장 확인 팝업 */
  .confirm-box{background:#1e2a3e;border:1px solid #4da6ff;border-radius:10px;padding:1.2rem 1.4rem;margin-top:.6rem}
  .confirm-q{font-size:14px;color:#fafafa;margin-bottom:.8rem;line-height:1.7}
  .confirm-q span{color:#4da6ff;font-weight:600}
  .confirm-btns{display:flex;gap:8px}
  .yes-btn{flex:1;background:#2E7D32;border:none;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;padding:.6rem;border-radius:6px;cursor:pointer}
  .yes-btn:hover{background:#1B5E20}
  .no-btn{flex:1;background:#37474F;border:none;color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;padding:.6rem;border-radius:6px;cursor:pointer}
  .no-btn:hover{background:#263238}

  /* 저장 완료 알림 */
  .save-ok{background:#1B5E20;border:1px solid #2E7D32;border-radius:6px;padding:.6rem 1rem;margin-top:.5rem;font-size:13px;color:#A5D6A7}
  .save-skip{background:#1a1f2e;border:1px solid #37474F;border-radius:6px;padding:.6rem 1rem;margin-top:.5rem;font-size:13px;color:#78909C}

  .json-label{font-size:11px;color:#555;margin-top:1rem;margin-bottom:.3rem}
  .json-box{background:#111;border:1px solid #222;border-radius:6px;padding:.7rem 1rem;font-family:'Courier New',monospace;font-size:11px;color:#6ee7b7;line-height:1.7}
  .topbar{display:flex;align-items:center;gap:5px;margin-bottom:1rem}
  .dot{width:8px;height:8px;border-radius:50%}
  .url{font-size:11px;color:#444;margin-left:8px}
</style>

<div class="app">
  <div class="topbar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span class="url">localhost:8501</span>
  </div>
  <div class="st-title">🎙️ 노인일자리 반복업무 AI 자동화 시스템</div>
  <div class="st-divider"></div>
  <div class="st-label">일자리 유형을 선택하세요</div>
  <div class="box-row">
    <div class="type-box" onclick="playMent('공익형', this)">
      <div class="icon">🏛️</div>
      <div class="label">공익형</div>
      <div class="sub">만 65세 이상</div>
    </div>
    <div class="type-box" onclick="playMent('역량형', this)">
      <div class="icon">💼</div>
      <div class="label">역량형</div>
      <div class="sub">만 65세 이상</div>
    </div>
    <div class="type-box" onclick="playMent('공동체형', this)">
      <div class="icon">🤝</div>
      <div class="label">공동체형</div>
      <div class="sub">만 60세 이상</div>
    </div>
    <div class="type-box all-box" onclick="playAll(this)">
      <div class="icon">📢</div>
      <div class="label">전체방송</div>
      <div class="sub">통합 안내</div>
    </div>
  </div>

  <div class="ment-box">
    <div class="ment-label">▶ 안내 멘트</div>
    <div class="now-playing hidden" id="now-playing"></div>
    <div class="ment-placeholder" id="ment-placeholder">유형을 선택하면 어르신 맞춤 안내 멘트가 자동 재생됩니다.</div>
    <div class="ment-text hidden" id="ment-text"></div>
    <div class="sound-bar hidden" id="sound-bar">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>
  <button class="stop-btn hidden" id="stop-btn" onclick="stopAll()">⏹ 재생 중지</button>

  <div class="divider2"></div>
  <div class="st-label">직접 입력하여 음성 변환</div>
  <textarea class="st-textarea" id="custom-text" placeholder="안내할 내용을 직접 입력하세요...&#10;예) 이번 오리엔테이션은 5월 10일 오전 10시 복지관 대강당에서 진행됩니다."></textarea>
  <div class="btn-row2">
    <button class="st-btn" onclick="speakCustom()" id="speak-btn">🔊 음성 재생</button>
  </div>

  <!-- 저장 확인 팝업 -->
  <div class="confirm-box hidden" id="confirm-box">
    <div class="confirm-q" id="confirm-q"></div>
    <div class="confirm-btns">
      <button class="yes-btn" onclick="doSave()">✅ 예, 저장합니다</button>
      <button class="no-btn" onclick="skipSave()">❌ 아니요</button>
    </div>
  </div>
  <div class="save-ok hidden" id="save-ok">💾 JSON에 저장되었습니다.</div>
  <div class="save-skip hidden" id="save-skip">저장하지 않았습니다.</div>

  <div class="json-label">💾 JSON 저장 목록</div>
  <div class="json-box" id="json-log">{ "log": [] }</div>
</div>

<script>
const addr = "운남동 쪽빛하늘로 21번지 운남우체국 3층";
const hours = "평일 오전 9시부터 오후 6시까지이며, 토요일, 일요일, 공휴일은 휴무입니다";
const jeje = `생계급여 수급자이시거나, 건강보험 직장가입자이시거나, 현재 정부 및 지자체 일자리에 참여 중이시거나, 장기요양 1에서 5등급 또는 인지지원등급을 받으신 분은 신청이 제한됩니다.`;
const common_end = `준비 서류는 주민등록등본 1부와 본인 통장 사본입니다.\n상담 시간은 ${hours}.\n저희 사무실은 ${addr}에 위치해 있습니다.\n감사합니다.`;

const ments = {
  '공익형': `안녕하세요. 노인 공익형 일자리에 대해 안내해 드리겠습니다.\n\n공익형은 만 65세 이상, 기초연금수급자이신 분이 신청하실 수 있습니다.\n\n노노케어, 학교 안전 도우미, 공원 환경 정비 등 16가지 사업이 있으며, 주 2회에서 3회, 하루 3시간 활동하시고 매월 약 29만 원의 활동비가 지급됩니다.\n\n단, 참여가 어려우신 경우도 있습니다. ${jeje}\n\n${common_end}`,
  '역량형': `안녕하세요. 노인 역량형 일자리에 대해 안내해 드리겠습니다.\n\n역량형은 만 65세 이상이신 분이 신청하실 수 있으며, 기초연금을 받지 않으시는 분도 지원이 가능합니다.\n\n아동 돌봄, 경로당 급식, 공공기관 업무 보조 등 다양한 사업이 있으며, 주 5일, 하루 3시간 활동하시고 매월 최대 761,040원의 급여가 지급됩니다. 산재보험과 건강보험도 가입됩니다.\n\n유관 자격증이 필요한 경우, 관련분야 국가자격(전문, 기술) 보유자만 신청하실 수 있으며 자격증 사본을 제출하셔야 합니다. 민간자격증은 인정하지 않습니다.\n\n단, 참여가 어려우신 경우도 있습니다. ${jeje}\n\n${common_end}`,
  '공동체형': `안녕하세요. 노인 공동체형 일자리에 대해 안내해 드리겠습니다.\n\n공동체형은 만 60세 이상, 기초연금수급자이신 분이 신청하실 수 있습니다.\n\n꽃 포장 작업장, 쌀과자 제조 및 판매, 실버카페 운영 등의 사업이 있으며, 쇼핑백 포장과 카페 운영은 시급 12,000원으로 월 6일에서 7일, 하루 5시간 활동하시고 월 360,000원에서 460,000원이 지급됩니다. 수익금도 추가로 받으실 수 있으며, 바리스타 자격증이 있으신 분은 카페 운영에서 우대됩니다.\n\n단, 참여가 어려우신 경우도 있습니다. ${jeje}\n\n${common_end}`,
  '전체': `안녕하세요. 노인일자리 세 가지 유형에 대해 통합 안내해 드리겠습니다.\n\n첫 번째, 공익형입니다.\n만 65세 이상, 기초연금수급자이신 분이 신청하실 수 있습니다.\n노노케어, 학교 안전 도우미, 공원 환경 정비 등 16가지 사업이 있으며, 주 2회에서 3회, 하루 3시간 활동하시고 매월 약 29만 원의 활동비가 지급됩니다.\n\n두 번째, 역량형입니다.\n만 65세 이상이신 분이 신청하실 수 있으며, 기초연금을 받지 않으시는 분도 지원이 가능합니다.\n아동 돌봄, 경로당 급식, 공공기관 업무 보조 등 다양한 사업이 있으며, 주 5일, 하루 3시간 활동하시고 매월 최대 761,040원의 급여가 지급됩니다. 산재보험과 건강보험도 가입됩니다. 유관 자격증이 필요한 경우 국가자격 보유자만 신청하실 수 있습니다.\n\n세 번째, 공동체형입니다.\n만 60세 이상, 기초연금수급자이신 분이 신청하실 수 있습니다.\n꽃 포장 작업장, 쌀과자 제조 및 판매, 실버카페 운영 등의 사업이 있으며, 쇼핑백 포장과 카페 운영은 시급 12,000원으로 월 6일에서 7일, 하루 5시간 활동하시고 월 360,000원에서 460,000원이 지급됩니다. 바리스타 자격증이 있으신 분은 우대됩니다.\n\n공통 안내 말씀드립니다.\n${jeje}\n\n${common_end}`
};

let logData = [];
let pendingText = '';

function now() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0');
}

function showMent(text, label) {
  document.getElementById('ment-placeholder').classList.add('hidden');
  document.getElementById('ment-text').classList.remove('hidden');
  document.getElementById('ment-text').textContent = text;
  document.getElementById('sound-bar').classList.remove('hidden');
  const np = document.getElementById('now-playing');
  if(label){ np.classList.remove('hidden'); np.textContent = '📢 ' + label; }
  else np.classList.add('hidden');
}

function hideConfirm() {
  document.getElementById('confirm-box').classList.add('hidden');
  document.getElementById('save-ok').classList.add('hidden');
  document.getElementById('save-skip').classList.add('hidden');
}

function stopAll() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('sound-bar').classList.add('hidden');
  document.getElementById('stop-btn').classList.add('hidden');
  document.getElementById('now-playing').classList.add('hidden');
  document.querySelectorAll('.type-box').forEach(b => b.classList.remove('active'));
}

function speak(text, onEnd) {
  if('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR'; u.rate = 0.85;
    u.onend = onEnd || null;
    window.speechSynthesis.speak(u);
  } else {
    setTimeout(onEnd || (()=>{}), 5000);
  }
}

function playMent(type, el) {
  stopAll();
  hideConfirm();
  document.querySelectorAll('.type-box').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const text = ments[type];
  showMent(text, null);
  document.getElementById('stop-btn').classList.remove('hidden');
  speak(text, () => {
    document.getElementById('sound-bar').classList.add('hidden');
    document.getElementById('stop-btn').classList.add('hidden');
  });
  logData.push({ time: now(), type, method: 'button', text: text.substring(0,30)+'...' });
  document.getElementById('json-log').textContent = JSON.stringify({ log: logData.slice(-5) }, null, 2);
}

function playAll(el) {
  stopAll();
  hideConfirm();
  document.querySelectorAll('.type-box').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const text = ments['전체'];
  showMent(text, '전체 통합 안내 방송 중');
  document.getElementById('stop-btn').classList.remove('hidden');
  speak(text, () => {
    document.getElementById('sound-bar').classList.add('hidden');
    document.getElementById('stop-btn').classList.add('hidden');
    document.getElementById('now-playing').classList.add('hidden');
  });
  logData.push({ time: now(), type: '전체방송', method: '통합', text: '공익형+역량형+공동체형' });
  document.getElementById('json-log').textContent = JSON.stringify({ log: logData.slice(-5) }, null, 2);
}

function speakCustom() {
  const text = document.getElementById('custom-text').value.trim();
  if(!text) return;
  stopAll();
  hideConfirm();
  showMent(text, null);
  document.getElementById('stop-btn').classList.remove('hidden');

  const btn = document.getElementById('speak-btn');
  btn.disabled = true; btn.textContent = '🔊 재생 중...';

  speak(text, () => {
    document.getElementById('sound-bar').classList.add('hidden');
    document.getElementById('stop-btn').classList.add('hidden');
    btn.disabled = false; btn.textContent = '🔊 음성 재생';

    // 재생 완료 후 저장 여부 묻기
    pendingText = text;
    const preview = text.length > 40 ? text.substring(0, 40) + '...' : text;
    document.getElementById('confirm-q').innerHTML = `다음 내용을 JSON으로 저장하시겠습니까?<br><span>"${preview}"</span>`;
    document.getElementById('confirm-box').classList.remove('hidden');
  });
}

function doSave() {
  logData.push({ time: now(), type: '직접입력', method: 'text', text: pendingText });
  document.getElementById('json-log').textContent = JSON.stringify({ log: logData.slice(-5) }, null, 2);
  document.getElementById('confirm-box').classList.add('hidden');
  document.getElementById('save-ok').classList.remove('hidden');
  setTimeout(() => document.getElementById('save-ok').classList.add('hidden'), 2500);
  pendingText = '';
}

function skipSave() {
  document.getElementById('confirm-box').classList.add('hidden');
  document.getElementById('save-skip').classList.remove('hidden');
  setTimeout(() => document.getElementById('save-skip').classList.add('hidden'), 2000);
  pendingText = '';
}
</script>
